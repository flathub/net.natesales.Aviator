app-id: net.natesales.Aviator
command: aviator
sdk: org.gnome.Sdk
runtime: org.gnome.Platform
runtime-version: "50"
sdk-extensions:
 - org.freedesktop.Sdk.Extension.llvm20

finish-args:
  - --share=ipc
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=host

build-options:
  prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
  prepend-path: /usr/lib/sdk/llvm20/bin

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.la'
  - '*.a'
cleanup-commands:
  - python3 -m compileall --invalidation-mode=unchecked-hash /app

modules:
  - name: svt-av1
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - "-DCMAKE_C_COMPILER=clang"
      - "-DCMAKE_CXX_COMPILER=clang++"
      - "-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld"
      - "-DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld"
      - "-DCMAKE_BUILD_TYPE=Release"
      - "-DCMAKE_CXX_FLAGS=-O3 -flto"
      - "-DCMAKE_C_FLAGS=-O3 -flto"
      - "-DBUILD_SHARED_LIBS=ON"
      - "-DBUILD_APPS=OFF"
      - "-DBUILD_TESTING=OFF"
    sources:
      - type: git
        url: https://github.com/juliobbv-p/svt-av1-hdr
        commit: 3b7097c3ca1194aa2590fa249ca95329323c9691

  - name: ffmpeg
    build-options:
      env:
        CC: clang
        CXX: clang++
        LD: lld
        LDFLAGS: "-fuse-ld=lld"
    config-opts:
      - --enable-static
      - --enable-gpl
      - --enable-libdav1d
      - --enable-libopus
      - --enable-libsvtav1
    buildsystem: autotools
    sources:
      - type: git
        url: https://git.ffmpeg.org/ffmpeg.git
        commit: 140fd653aed8cad774f991ba083e2d01e86420c7

  - name: nnedi3_weights.bin
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/dubhater/vapoursynth-nnedi3
        commit: 8c35822ae358e46c99aae52e5a93010f1a5a6be6
    build-commands:
      - install src/nnedi3_weights.bin /app/bin/nnedi3_weights.bin

  - pypi-dependencies.yaml

  - name: aviator
    builddir: true
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/gianni-rosato/aviator
        commit: f4eed62a2d5f23fbc6ee776c5196296503b2a118
